name: Lint

on:
  push:
    branches: [main]
  pull_request:

jobs:
  luacheck:
    name: Luacheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: leafo/gh-actions-lua@v10
        with:
          luaVersion: "5.1"

      - uses: leafo/gh-actions-luarocks@v6

      - name: Install luacheck
        run: luarocks install luacheck

      - name: Run luacheck
        run: luacheck .

  tests:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: leafo/gh-actions-lua@v10
        with:
          luaVersion: "5.1"

      # No test framework to install: tests/harness.lua is the framework and
      # tests/wow_stub.lua is the game. The addon loads under a stubbed client
      # and its pure logic -- priority parsing, value templating, the profile
      # schema, import/export, every preset -- is called directly.
      - name: Run the test suite
        run: lua tests/run.lua

  toc:
    name: TOC completeness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # A .lua file that isn't listed in the TOC never loads, which is easy to
      # miss in review and impossible to spot in-game without hunting.
      #
      # The TOC uses Windows separators (Locales\deDE.lua), so entries are
      # normalized to forward slashes before comparing -- an earlier version of
      # this check anchored on [A-Za-z0-9_/-]+ and silently skipped every
      # subdirectory entry, which is exactly the case worth catching.
      - name: Every Lua file is in the TOC, and every TOC entry exists
        shell: bash
        run: |
          status=0
          # Normalize separators before matching, not inside the pattern: '\134'
          # is octal for backslash and avoids an escaping level that would
          # otherwise differ between a shell and a YAML block scalar.
          listed=$(tr '\134' '/' < StatPanel.toc | tr -d '\r' | grep -oiE '^[A-Za-z0-9_./-]+\.lua')

          for file in $listed; do
            if [ ! -f "$file" ]; then
              echo "::error file=StatPanel.toc::TOC lists '$file' but it does not exist"
              status=1
            fi
          done

          # tests/ is excluded here and in .pkgmeta: it never ships and never
          # loads in game, so being absent from the TOC is correct for it.
          for file in $(find . -name '*.lua' -not -path './.git/*' \
              -not -path './tests/*' | sed 's|^\./||' | sort); do
            if ! echo "$listed" | grep -qxF "$file"; then
              echo "::error file=$file::'$file' is not listed in StatPanel.toc and will never load"
              status=1
            fi
          done

          [ $status -eq 0 ] && echo "All Lua files are accounted for."
          exit $status

  locales:
    name: Locales
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # SP.L falls back silently, so a mistyped key or a dropped format
      # specifier is invisible at runtime until the moment it breaks. pwsh ships
      # on the ubuntu-latest image.
      - name: Lint locale files
        shell: pwsh
        run: pwsh -File tools/locale-lint.ps1
